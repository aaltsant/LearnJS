name: Keep App and DB Alive

on:
  schedule:
    # Ajetaan joka 14. minuutti
    - cron: '*/14 * * * *'
  workflow_dispatch: # Tämä mahdollistaa testiajon napista suoraan GitHubista

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sS --fail "https://learnjs-l2qq.onrender.com/api/health" || echo "Ping epäonnistui"